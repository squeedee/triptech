<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triptech · menu-controller</title>
<style>
  :root{
    --ch1:#22dd66; --ch2:#ffcc00; --ch3:#ff4433; --accent:#7799ff;
    --bg:#07070b; --chassis:#15151c; --chassis2:#0f0f15;
    --border:#28283a; --border2:#38384e; --text:#c8c8d0; --dim:#54546a;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 800px at 50% -10%,#16161f,var(--bg));
    color:var(--text);
    font:13px/1.4 'SF Mono','Menlo','Consolas','Courier New',monospace;
    display:flex;flex-direction:column;align-items:center;gap:18px;
    padding:26px 16px 40px;
  }

  /* ---- top bar (host UI, not the device screen) ---- */
  .host{
    width:760px;max-width:96vw;display:flex;align-items:center;gap:12px;
  }
  .host .title{font-weight:700;letter-spacing:.5px;font-size:15px}
  .host .title span{color:var(--accent)}
  .host .sub{color:var(--dim);font-size:11px}
  .host .spacer{flex:1}
  select,.btn{
    background:var(--chassis2);color:var(--text);border:1px solid var(--border2);
    border-radius:7px;padding:6px 10px;font:inherit;font-size:11px;cursor:pointer;
  }
  .btn:hover{border-color:var(--accent)}
  .led{width:9px;height:9px;border-radius:50%;background:#552222;box-shadow:0 0 0 1px #000 inset}
  .led.on{background:var(--ch1);box-shadow:0 0 8px var(--ch1)}

  /* ---- the physical device ---- */
  .device{
    background:linear-gradient(180deg,#1b1b24,#101016);
    border:1px solid var(--border2);border-radius:22px;
    box-shadow:0 24px 60px rgba(0,0,0,.6),0 2px 0 #2a2a3a inset;
    padding:22px;display:flex;flex-direction:column;gap:18px;align-items:center;
  }
  .device .row{display:flex;gap:22px;align-items:flex-start}

  /* screen: 240x320 drawn natively, shown at 2x */
  .screen-bezel{
    background:#000;border:3px solid #050507;border-radius:10px;padding:6px;
    box-shadow:0 0 0 1px #2c2c3c,0 10px 30px rgba(0,0,0,.6) inset;
  }
  #screen{display:block;width:480px;height:640px;border-radius:4px;background:#000}

  /* encoder column to the right of the screen */
  .enc-col{position:relative;width:118px;height:652px}
  .enc-bottom{display:flex;justify-content:center;width:100%}

  .enc{position:absolute;width:118px;display:flex;flex-direction:column;align-items:center;gap:5px}
  .enc-bottom .enc{position:static}
  .dial{
    width:74px;height:74px;border-radius:50%;cursor:ns-resize;position:relative;
    background:radial-gradient(circle at 38% 32%,#3a3a4a,#16161d 70%);
    border:2px solid #05050a;
    box-shadow:0 4px 10px rgba(0,0,0,.6),0 1px 0 #44445a inset;
    touch-action:none;
  }
  .dial:active{cursor:grabbing}
  .dial .ring{position:absolute;inset:8px;border-radius:50%;border:1px dashed #2c2c3c}
  .dial .ptr{
    position:absolute;left:50%;top:6px;width:3px;height:26px;margin-left:-1.5px;
    background:var(--accent);border-radius:2px;transform-origin:50% 31px;
    box-shadow:0 0 6px var(--accent);
  }
  .dial.pushed{box-shadow:0 1px 4px rgba(0,0,0,.8) inset,0 0 0 2px var(--accent)}
  .enc .cap{font-size:10px;color:var(--dim);letter-spacing:1px}
  .enc .fn{font-size:11px;font-weight:700;color:var(--text);text-align:center;min-height:14px}
  .enc .val{font-size:10px;color:var(--accent);text-align:center;min-height:12px}
  .enc .hint{font-size:9px;color:var(--dim);text-align:center;min-height:11px}

  /* keyboard legend */
  .legend{
    width:760px;max-width:96vw;color:var(--dim);font-size:11px;
    display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;
  }
  .legend b{color:var(--text);font-weight:700}
  kbd{
    background:var(--chassis2);border:1px solid var(--border2);border-bottom-width:2px;
    border-radius:4px;padding:1px 5px;color:var(--text);font-size:10px;
  }
</style>
</head>
<body>

<div class="host">
  <div class="title">TRIP<span>TECH</span> · menu-controller</div>
  <div class="sub">240×320 · 4 encoders · ILI9341 UX prototype</div>
  <div class="spacer"></div>
  <span class="led" id="midiLed"></span>
  <select id="midiOut"><option>MIDI out…</option></select>
  <select id="midiIn"><option>MIDI in…</option></select>
  <button class="btn" id="syncBtn" title="Request full state from device">⟳ sync</button>
</div>

<div class="device">
  <div class="row">
    <div class="screen-bezel">
      <canvas id="screen" width="240" height="320"></canvas>
    </div>
    <div class="enc-col">
      <div class="enc" id="encE1" style="top:130px">
        <div class="dial"><div class="ring"></div><div class="ptr"></div></div>
        <div class="cap">E1</div><div class="fn"></div><div class="val"></div><div class="hint"></div>
      </div>
      <div class="enc" id="encE2" style="top:312px">
        <div class="dial"><div class="ring"></div><div class="ptr"></div></div>
        <div class="cap">E2</div><div class="fn"></div><div class="val"></div><div class="hint"></div>
      </div>
      <div class="enc" id="encE3" style="top:494px">
        <div class="dial"><div class="ring"></div><div class="ptr"></div></div>
        <div class="cap">E3</div><div class="fn"></div><div class="val"></div><div class="hint"></div>
      </div>
    </div>
  </div>
  <div class="enc-bottom">
    <div class="enc" id="encNAV">
      <div class="dial"><div class="ring"></div><div class="ptr"></div></div>
      <div class="cap">NAV</div><div class="fn"></div><div class="val"></div><div class="hint"></div>
    </div>
  </div>
</div>

<div class="legend">
  <span><b>NAV</b> <kbd>,</kbd><kbd>.</kbd> section · <kbd>Enter</kbd> context</span>
  <span><b>E1</b> <kbd>Q</kbd><kbd>A</kbd> · push <kbd>1</kbd></span>
  <span><b>E2</b> <kbd>W</kbd><kbd>S</kbd> · push <kbd>2</kbd></span>
  <span><b>E3</b> <kbd>E</kbd><kbd>D</kbd> · push <kbd>3</kbd></span>
  <span>drag / scroll any dial · click = push</span>
</div>

<script>
/* ============================================================================
   TRIPTECH menu-controller
   Emulates the `menu` control surface (../menu): a 240x320 ILI9341 TFT with
   four PEC11H rotary encoders — one below the screen (NAV) and three to the
   right (E1/E2/E3), each owning one horizontal third of the screen.

   Navigation model (voice-editor):
     NAV turn  -> select SECTION within the current context
     NAV push  -> cycle CONTEXT: CH1 -> CH2 -> CH3 -> GLOBAL
     E1/E2/E3  -> edit the parameter shown in band 1/2/3 (turn), or its
                  push action (mute / sync / toggle / load …)

   Drives Triptech.cpp over Web MIDI using the exact CC map from
   expanded-controller.html.  Everything drawn on the canvas is sized in real
   240x320 device pixels so this doubles as a firmware layout reference.
   ============================================================================ */

/* ---------- device constants (mirror Triptech.cpp) ---------- */
const CH_BASE  = [20, 36, 52];
const CH_COLOR = ['#22dd66', '#ffcc00', '#ff4433'];
const CH_NAME  = ['CH1', 'CH2', 'CH3'];
const ACCENT   = '#7799ff';
const NUM_PAT  = 16;

/* ---------- value formatters (from expanded-controller.html) ---------- */
const logMap = (cc, lo, hi) => lo * Math.pow(hi / lo, cc / 127);
const linMap = (cc, lo, hi) => lo + (cc / 127) * (hi - lo);
const DIV = ['1/2','1/2T','1/4','1/4T','1/8','1/8T','1/16','1/16T'];
const FMT = {
  cutoff:  cc => { const v = logMap(cc,100,20000); return v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0)+'Hz'; },
  res:     cc => linMap(cc,0,0.95).toFixed(2),
  drive:   cc => '×'+linMap(cc,1,4).toFixed(2),
  level:   cc => (cc/127).toFixed(2),
  attack:  cc => { const v = logMap(cc,.001,2); return v<1?(v*1000).toFixed(0)+'ms':v.toFixed(2)+'s'; },
  decay:   cc => { const v = logMap(cc,.01,2);  return v<1?(v*1000).toFixed(0)+'ms':v.toFixed(2)+'s'; },
  pan:     cc => { const d = cc-63.5; if(Math.abs(d)<4) return 'CTR'; const p=Math.round(Math.abs(d)/63.5*100); return d<0?'L'+p:'R'+p; },
  lfoRate: cc => logMap(cc,.1,20).toFixed(1)+'Hz',
  pct:     cc => Math.round(cc/127*100)+'%',
  bipct:   cc => { const p=Math.max(-100,Math.min(100,Math.round((cc-64)/63*100))); return (p>0?'+':'')+p+'%'; },
  delayDiv:cc => DIV[Math.min(7,cc>>4)],
  delayFre:cc => { const v = logMap(cc,10,2000); return v>=1000?(v/1000).toFixed(2)+'s':Math.round(v)+'ms'; },
  lfoDiv:  cc => DIV[Math.min(7,cc>>4)],
  clockDiv:cc => ['÷4','÷3','÷2','÷1.5','×1','×1.5','×2','×3','×4'][Math.min(8,(cc*9)>>7)],
  bpm:     cc => Math.round(20+cc/127*280)+' BPM',
};

/* ---------- parameter model: contexts -> sections -> 3 bands ----------
   Channel bands use `off` (CC offset added to CH_BASE).
   Global bands use `cc` (absolute).
   kinds: cont (knob) | enum | toggle | patIndex | patch | action          */
const SEC_CH = [
  { name:'FILTER', bands:[
    { label:'TYPE',  off:9,  kind:'enum', opts:[['LP',0],['BP',32],['HP',64],['NOTCH',96]] },
    { label:'SLOPE', off:10, kind:'enum', opts:[['6dB',0],['12dB',63],['24dB',126]] },
    { label:'FREQ',  off:0,  fmt:'cutoff' },
  ]},
  { name:'TONE', bands:[
    { label:'Q',        off:1, fmt:'res' },
    { label:'DRIVE',    off:2, fmt:'drive' },
    { label:'LFO→FILT', off:8, lsb:12, fmt:'bipct', bip:true },
  ]},
  { name:'ENV', bands:[
    { label:'ATTACK', off:4, fmt:'attack' },
    { label:'DECAY',  off:5, fmt:'decay' },
    { label:'LEVEL',  off:6, fmt:'level' },
  ]},
  { name:'LFO', bands:[
    { label:'SHAPE', off:11, kind:'enum', opts:[['TRI',0],['SIN',21],['SQ',42]], push:'lfoSync' },
    { label:'RATE',  off:3,  dyn:'lfoRate' },
    { label:'DUTY',  off:14, fmt:'pct' },
  ]},
  { name:'OUT', bands:[
    { label:'PAN',      off:7,  fmt:'pan' },
    { label:'AMP MOD',  off:15, fmt:'bipct', bip:true },
    { label:'DLY SEND', off:13, fmt:'level' },
  ]},
];
const SEC_GL = [
  { name:'SEQ', bands:[
    { label:'PATTERN', cc:14, kind:'patIndex', push:'run' },
    { label:'CLK DIV', cc:5,  fmt:'clockDiv' },
    { label:'BPM',     cc:19, fmt:'bpm', push:'tap' },
  ]},
  { name:'DELAY', bands:[
    { label:'TIME',  cc:1, dyn:'delayTime', push:'delaySync' },
    { label:'FDBK',  cc:2, fmt:'level' },
    { label:'WIDTH', cc:3, fmt:'level' },
  ]},
  { name:'MIX', bands:[
    { label:'CH1 LVL', cc:26, fmt:'level', push:'mute', ch:0 },
    { label:'CH2 LVL', cc:42, fmt:'level', push:'mute', ch:1 },
    { label:'CH3 LVL', cc:58, fmt:'level', push:'mute', ch:2 },
  ]},
  { name:'MASTER', bands:[
    { label:'DRY',    cc:4,  fmt:'level' },
    { label:'BYPASS', cc:18, kind:'toggle', stateKey:'bypassed', push:'bypass' },
    { label:'RUN',    cc:15, kind:'toggle', stateKey:'running',  push:'run' },
  ]},
  { name:'PATCH', bands:[
    { label:'PATCH', kind:'patch',  push:'load' },
    { label:'SAVE',  kind:'action', push:'save', hint:'PUSH = SAVE' },
    { label:'STATE', kind:'action', push:'sync', hint:'PUSH = RE-SYNC' },
  ]},
];

/* ---------- mutable state ---------- */
const vals = new Array(128).fill(0);      // current 7-bit value per CC
const lfoMsb = [0,0,0];                    // 14-bit MSB cache per channel
const S = {
  ctx: 0, sec: 0,                          // ctx 0..2 = channels, 3 = global
  muted:[false,false,false],
  lfoSynced:[true,true,true],
  delaySynced:true, running:false, bypassed:false,
  patch:0, midiAct:0,
};

function initDefaults(){
  // channel defaults (DFLTS from expanded-controller, per [LP,BP,HP])
  const D = {0:[50,72,60],1:[67,67,67],2:[0,0,0],3:[55,55,55],4:[27,27,27],
            5:[63,63,63],6:[89,89,89],7:[63,31,95],8:[64,64,64],9:[0,32,64],
            10:[63,63,63],11:[21,21,21],13:[0,0,0],14:[64,64,64],15:[64,64,64]};
  for(let c=0;c<3;c++) for(const k in D) vals[CH_BASE[c]+(+k)] = D[k][c];
  // globals
  vals[1]=32; vals[2]=53; vals[3]=127; vals[4]=0; vals[5]=64; vals[6]=127;
  vals[14]=0; vals[15]=0; vals[18]=0; vals[19]=45;
}
initDefaults();

/* ---------- helpers over the model ---------- */
const sections = () => S.ctx<3 ? SEC_CH : SEC_GL;
const section  = () => sections()[S.sec];
const ctxColor = () => S.ctx<3 ? CH_COLOR[S.ctx] : ACCENT;
const absCC = b => (b.cc!=null ? b.cc : CH_BASE[S.ctx]+b.off);

function enumIdx(b){           // nearest option index for current raw value
  const v = vals[absCC(b)]; let best=0, bd=1e9;
  b.opts.forEach((o,i)=>{ const d=Math.abs(o[1]-v); if(d<bd){bd=d;best=i;} });
  return best;
}

function bandText(b){
  switch(b.kind){
    case 'enum':     return b.opts[enumIdx(b)][0];
    case 'toggle':   return S[b.stateKey] ? 'ON' : 'OFF';
    case 'patIndex': return 'PAT '+(Math.round(vals[14]/8)+1)+'/'+NUM_PAT;
    case 'patch':    return 'P'+String(S.patch+1).padStart(2,'0');
    case 'action':   return '—';
    default: {
      let fmt = b.fmt;
      if(b.dyn==='delayTime') fmt = S.delaySynced ? 'delayDiv' : 'delayFre';
      if(b.dyn==='lfoRate')   fmt = S.lfoSynced[S.ctx] ? 'lfoDiv' : 'lfoRate';
      return FMT[fmt](vals[absCC(b)]);
    }
  }
}

function pushHint(b){
  switch(b.push){
    case 'mute':      return S.ctx<3?'':'push:mute';
    case 'lfoSync':   return 'push:sync';
    case 'delaySync': return 'push:sync';
    case 'run':       return 'push:run';
    case 'tap':       return 'push:tap';
    case 'bypass':    return 'push:byp';
    case 'load':      return 'push:load';
    case 'save':      return 'push:save';
    case 'sync':      return 'push:sync';
    default:          return '';
  }
}

/* ---------- Web MIDI ---------- */
let midiOut=null, midiIn=null, midiCh=0;
const midiLed=document.getElementById('midiLed');

function sendCC(cc,val){ if(midiOut) midiOut.send([0xB0|midiCh, cc&0x7f, Math.max(0,Math.min(127,Math.round(val)))]); }
function sendPC(p){ if(midiOut) midiOut.send([0xC0|midiCh, p&0x7f]); }
function muteMask(){ let m=0; for(let i=0;i<3;i++) if(S.muted[i]) m|=(1<<i); sendCC(68,m); }

async function initMIDI(){
  if(!navigator.requestMIDIAccess) return;
  let acc; try{ acc=await navigator.requestMIDIAccess(); }catch(e){ return; }
  const outSel=document.getElementById('midiOut'), inSel=document.getElementById('midiIn');
  function refresh(){
    outSel.innerHTML='<option value="">MIDI out…</option>';
    inSel.innerHTML ='<option value="">MIDI in…</option>';
    for(const o of acc.outputs.values()) outSel.add(new Option(o.name,o.id));
    for(const i of acc.inputs.values())  inSel.add(new Option(i.name,i.id));
  }
  refresh(); acc.onstatechange=refresh;
  outSel.onchange=e=>{ midiOut=[...acc.outputs.values()].find(o=>o.id===e.target.value)||null;
                       midiLed.classList.toggle('on',!!midiOut); if(midiOut) sendCC(119,0); };
  inSel.onchange =e=>{ if(midiIn) midiIn.onmidimessage=null;
                       midiIn=[...acc.inputs.values()].find(i=>i.id===e.target.value)||null;
                       if(midiIn) midiIn.onmidimessage=onMIDI; };
}

function onMIDI(ev){
  const [st,d1,d2]=ev.data; const t=st&0xf0; S.midiAct=8;
  if(t===0xC0){ S.patch=d1&0x3f; render(); return; }
  if(t!==0xB0) return;
  handleCC(d1,d2); render();
}

function handleCC(cc,val){
  // globals
  switch(cc){
    case 6:  S.delaySynced=val>=64; return;
    case 15: S.running=val>=64; return;
    case 18: S.bypassed=val>=64; return;
    case 68: for(let i=0;i<3;i++) S.muted[i]=!!((val>>i)&1); return;
    case 119: return;
    case 87: return;
  }
  if(cc>=1&&cc<=5 || cc===14 || cc===19){ vals[cc]=val; return; }
  // per-channel
  for(let c=0;c<3;c++){
    const off=cc-CH_BASE[c]; if(off<0||off>15) continue;
    if(off===8){ lfoMsb[c]=val; }
    else if(off===12){ const v14=(lfoMsb[c]<<7)|val; vals[CH_BASE[c]+8]=Math.round(v14/16383*127); }
    else if(off===11){ S.lfoSynced[c]=val>=64; vals[cc]=val&0x3f; }
    else vals[cc]=val;
    return;
  }
}

/* ---------- editing (driven by encoders/keys) ---------- */
function setCC(cc,v,band){
  v=Math.max(0,Math.min(127,Math.round(v))); vals[cc]=v;
  if(band&&band.lsb!=null){                    // 14-bit pair (LFO->filter)
    const lsbCC=CH_BASE[S.ctx]+band.lsb, v14=Math.round(v/127*16383);
    sendCC(cc,v14>>7); sendCC(lsbCC,v14&0x7f);
  } else sendCC(cc,v);
}

function edit(i,dir){                           // E(i) turned by dir (+/-1)
  const b=section().bands[i];
  switch(b.kind){
    case 'enum':{
      let n=(enumIdx(b)+dir+b.opts.length)%b.opts.length;
      const raw=b.opts[n][1]; vals[absCC(b)]=raw;
      if(b.off===11) sendCC(absCC(b), raw + (S.lfoSynced[S.ctx]?64:0));   // pack shape+sync
      else sendCC(absCC(b), raw);
      break;
    }
    case 'toggle': togglePush(b); break;        // toggles step on turn too
    case 'patIndex':{
      let idx=Math.max(0,Math.min(NUM_PAT-1,Math.round(vals[14]/8)+dir));
      vals[14]=idx*8; sendCC(14,vals[14]); break;
    }
    case 'patch': S.patch=Math.max(0,Math.min(63,S.patch+dir)); break;
    case 'action': break;
    default:{ const step=2; setCC(absCC(b), vals[absCC(b)]+dir*step, b); }
  }
}

function togglePush(b){
  switch(b.push){
    case 'mute':      S.muted[b.ch]=!S.muted[b.ch]; muteMask(); break;
    case 'bypass':    S.bypassed=!S.bypassed; sendCC(18,S.bypassed?127:0); break;
    case 'run':       S.running=!S.running; sendCC(15,S.running?127:0); break;
    case 'tap':       sendCC(19,vals[19]); break;            // re-emit (tap handled host-side)
    case 'delaySync': S.delaySynced=!S.delaySynced; sendCC(6,S.delaySynced?127:0); break;
    case 'lfoSync':{
      S.lfoSynced[S.ctx]=!S.lfoSynced[S.ctx];
      const sh=section().bands.find(x=>x.off===11); sendCC(CH_BASE[S.ctx]+11, vals[CH_BASE[S.ctx]+11]+(S.lfoSynced[S.ctx]?64:0));
      break;
    }
    case 'load': sendPC(S.patch); break;
    case 'save': sendCC(87,S.patch); break;
    case 'sync': sendCC(119,0); break;
  }
}
function push(i){ const b=section().bands[i]; if(b.push) togglePush(b); }

function navTurn(dir){
  const n=sections().length; S.sec=(S.sec+dir+n)%n; render();
}
function navPush(){ S.ctx=(S.ctx+1)%4; S.sec=Math.min(S.sec,sections().length-1); render(); }

/* ============================================================================
   CANVAS — drawn in real 240x320 device pixels (firmware reference)
   ============================================================================ */
const cv=document.getElementById('screen'), g=cv.getContext('2d');
const W=240,H=320, TOP=28, FOOT=18, GAP=2;
const BAND_TOP=TOP+GAP, BAND_H=(H-BAND_TOP-FOOT-2*GAP)/3;   // ~89

function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function bandFill(y,frac,color,bip){
  rr(8,y,210,12,3); g.fillStyle='#1c1c26'; g.fill();
  g.fillStyle=color;
  if(bip){
    const cx=8+105; const w=Math.abs(frac-0.5)*210;
    rr(frac>=0.5?cx:cx-w, y, Math.max(2,w), 12, 3); g.fill();
    g.fillStyle='#000'; g.fillRect(cx-0.5,y,1,12);            // center tick
  } else { rr(8,y,Math.max(2,frac*210),12,3); g.fill(); }
}

function render(){
  g.clearRect(0,0,W,H);
  g.fillStyle='#0a0a0f'; g.fillRect(0,0,W,H);
  const col=ctxColor();

  /* --- top bar --- */
  g.fillStyle='#13131b'; g.fillRect(0,0,W,TOP);
  g.fillStyle=col; rr(6,6,46,16,4); g.fill();
  g.fillStyle='#000'; g.font='bold 11px monospace'; g.textBaseline='middle';
  g.textAlign='center'; g.fillText(S.ctx<3?CH_NAME[S.ctx]:'GLBL',29,15);
  g.textAlign='left'; g.fillStyle='#e6e6f0'; g.font='bold 13px monospace';
  g.fillText(section().name,60,15);
  // section dots
  const secs=sections().length; const dx=W-8-secs*9;
  for(let i=0;i<secs;i++){ g.beginPath(); g.arc(dx+i*9,14,2.5,0,7); g.fillStyle=i===S.sec?col:'#3a3a4a'; g.fill(); }
  // midi activity dot
  g.beginPath(); g.arc(W-6,7,2.5,0,7); g.fillStyle=S.midiAct>0?'#22dd66':'#33334a'; g.fill();

  /* --- three bands --- */
  section().bands.forEach((b,i)=>{
    const y=BAND_TOP+i*(BAND_H+GAP);
    rr(4,y,W-8,BAND_H,6); g.fillStyle='#101017'; g.fill();
    g.fillStyle=col; g.fillRect(4,y+4,3,BAND_H-8);            // accent stripe

    g.textBaseline='alphabetic'; g.textAlign='left';
    g.fillStyle=col; g.font='bold 12px monospace';
    g.fillText(b.label, 14, y+20);
    g.fillStyle='#3f3f55'; g.font='10px monospace'; g.textAlign='right';
    g.fillText('E'+(i+1), W-12, y+16);

    // mute / sync / state badges
    let badge=null,bcol='#ff4433';
    if(b.push==='mute'&&S.muted[b.ch]) badge='MUTE';
    if(b.push==='lfoSync')  { badge=S.lfoSynced[S.ctx]?'SYNC':'FREE'; bcol=S.lfoSynced[S.ctx]?ACCENT:'#666'; }
    if(b.push==='delaySync'){ badge=S.delaySynced?'SYNC':'FREE'; bcol=S.delaySynced?ACCENT:'#666'; }
    if(badge){ g.font='bold 9px monospace'; const bw=g.measureText(badge).width+8;
      rr(W-14-bw,y+8,bw,12,3); g.fillStyle=bcol; g.fill();
      g.fillStyle='#000'; g.textAlign='center'; g.fillText(badge,W-14-bw/2,y+17); }

    // value + control widget
    if(b.kind==='enum'){
      const cur=enumIdx(b); const n=b.opts.length; const cw=(210-(n-1)*4)/n;
      for(let k=0;k<n;k++){ const cx=8+k*(cw+4);
        rr(cx,y+34,cw,18,3); g.fillStyle=k===cur?col:'#191922'; g.fill();
        g.fillStyle=k===cur?'#000':'#6a6a82'; g.font='bold 10px monospace';
        g.textAlign='center'; g.textBaseline='middle'; g.fillText(b.opts[k][0],cx+cw/2,y+44); }
      g.textBaseline='alphabetic';
    } else if(b.kind==='toggle'){
      const on=S[b.stateKey];
      rr(8,y+32,210,22,5); g.fillStyle=on?col:'#191922'; g.fill();
      g.fillStyle=on?'#000':'#5a5a72'; g.font='bold 15px monospace';
      g.textAlign='center'; g.textBaseline='middle'; g.fillText(on?'ON':'OFF',113,y+44);
      g.textBaseline='alphabetic';
    } else if(b.kind==='action'||b.kind==='patch'||b.kind==='patIndex'){
      g.fillStyle='#f2f2fa'; g.font='bold 22px monospace'; g.textAlign='right';
      g.fillText(bandText(b), W-14, y+44);
      const h=b.hint||(b.kind==='patch'?'PUSH = LOAD':'');
      if(h){ g.fillStyle='#4a4a60'; g.font='10px monospace'; g.textAlign='left'; g.fillText(h,14,y+44); }
    } else {
      g.fillStyle='#f2f2fa'; g.font='bold 22px monospace'; g.textAlign='right';
      g.fillText(bandText(b), W-14, y+40);
      let frac=vals[absCC(b)]/127;
      bandFill(y+BAND_H-22, frac, col, b.bip);
    }
  });

  /* --- footer --- */
  g.fillStyle='#0d0d14'; g.fillRect(0,H-FOOT,W,FOOT);
  g.fillStyle='#4a4a60'; g.font='10px monospace'; g.textBaseline='middle';
  g.textAlign='left';  g.fillText('NAV turn:sec  push:ctx',8,H-FOOT/2);
  g.textAlign='right'; g.fillText(FMT.bpm(vals[19]),W-8,H-FOOT/2);

  updateEncoders();
  if(S.midiAct>0){ S.midiAct--; setTimeout(()=>render(),120); }
}

/* ---------- encoder DOM labels ---------- */
function setEnc(id,fn,val,hint){
  const e=document.getElementById(id);
  e.querySelector('.fn').textContent=fn;
  e.querySelector('.val').textContent=val;
  e.querySelector('.hint').textContent=hint;
}
function updateEncoders(){
  section().bands.forEach((b,i)=> setEnc('encE'+(i+1), b.label, bandText(b), pushHint(b)));
  setEnc('encNAV', (S.ctx<3?CH_NAME[S.ctx]:'GLOBAL')+' · '+section().name,
         (S.sec+1)+'/'+sections().length, 'turn:sec push:ctx');
}

/* ============================================================================
   ENCODER INPUT — drag (vertical), wheel, click-to-push
   ============================================================================ */
function bindEncoder(el, onTurn, onPush){
  const dial=el.querySelector('.dial'), ptr=el.querySelector('.ptr');
  let angle=0, dragging=false, lastY=0, acc=0, moved=0;
  const spin=d=>{ angle+=d*18; ptr.style.transform='rotate('+angle+'deg)'; };

  dial.addEventListener('pointerdown',e=>{
    dragging=true; moved=0; lastY=e.clientY; acc=0;
    dial.setPointerCapture(e.pointerId); dial.classList.add('pushed'); e.preventDefault();
  });
  dial.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const dy=lastY-e.clientY; lastY=e.clientY; moved+=Math.abs(dy); acc+=dy;
    while(Math.abs(acc)>=6){ const d=acc>0?1:-1; acc-=d*6; onTurn(d); spin(d); }
  });
  const up=()=>{ if(!dragging) return; dragging=false; dial.classList.remove('pushed');
    if(moved<4){ onPush(); spin(1); } };
  dial.addEventListener('pointerup',up);
  dial.addEventListener('pointercancel',up);
  dial.addEventListener('wheel',e=>{ e.preventDefault(); const d=e.deltaY<0?1:-1; onTurn(d); spin(d); },{passive:false});
}

bindEncoder(document.getElementById('encE1'), d=>{edit(0,d);render();}, ()=>{push(0);render();});
bindEncoder(document.getElementById('encE2'), d=>{edit(1,d);render();}, ()=>{push(1);render();});
bindEncoder(document.getElementById('encE3'), d=>{edit(2,d);render();}, ()=>{push(2);render();});
bindEncoder(document.getElementById('encNAV'), d=>navTurn(d), ()=>navPush());

/* ---------- keyboard ---------- */
const KEY={ q:[0,1], a:[0,-1], w:[1,1], s:[1,-1], e:[2,1], d:[2,-1] };
addEventListener('keydown',ev=>{
  const k=ev.key.toLowerCase();
  if(k in KEY){ edit(KEY[k][0],KEY[k][1]); render(); ev.preventDefault(); return; }
  if(k==='1'){ push(0); render(); }
  else if(k==='2'){ push(1); render(); }
  else if(k==='3'){ push(2); render(); }
  else if(k===',' ) navTurn(-1);
  else if(k==='.' ) navTurn(1);
  else if(k==='enter') navPush();
});

document.getElementById('syncBtn').onclick=()=>sendCC(119,0);

initMIDI();
render();
</script>
